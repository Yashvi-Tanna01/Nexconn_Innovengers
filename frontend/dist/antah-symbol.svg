<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer signal pulse rings (subtle) -->
  <circle cx="24" cy="24" r="21" stroke="#0D9488" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.4" />
  <circle cx="24" cy="24" r="14" stroke="#06B6D4" stroke-width="1.2" opacity="0.6" />
  
  <!-- Network signal vectors linking nodes -->
  <line x1="24" y1="24" x2="13" y2="15" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" />
  <line x1="24" y1="24" x2="35" y2="17" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" />
  <line x1="24" y1="24" x2="24" y2="36" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Central Signal Hub (ANTAH core) -->
  <circle cx="24" cy="24" r="5" fill="#0D9488" />
  <circle cx="24" cy="24" r="2.2" fill="#FFFFFF" />

  <!-- Peripheral Community Nodes -->
  <circle cx="13" cy="15" r="3.2" fill="#0B132B" stroke="#0D9488" stroke-width="1.5" />
  <circle cx="35" cy="17" r="3.5" fill="#D97706" stroke="#FFFFFF" stroke-width="1.2" />
  <circle cx="24" cy="36" r="3.2" fill="#06B6D4" stroke="#FFFFFF" stroke-width="1.2" />
</svg>
